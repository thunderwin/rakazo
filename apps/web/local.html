<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self' ws://127.0.0.1:*;"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b0c0e" />
    <title>ericBot</title>
    <script>
      (() => {
        try {
          const preference = localStorage.getItem("rakazo.uiAppearance");
          const systemLight = matchMedia("(prefers-color-scheme: light)").matches;
          document.documentElement.dataset.theme =
            preference === "light" || preference === "dark"
              ? preference
              : systemLight
                ? "light"
                : "dark";
        } catch {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/local-main.tsx"></script>
  </body>
</html>
