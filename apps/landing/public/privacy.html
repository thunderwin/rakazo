<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>隐私说明 · ericBot</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main>
      <nav aria-label="主导航">
        <a class="brand" href="/"><span class="brand-mark">e</span><span>ericBot</span></a>
        <span class="channel">Privacy</span>
      </nav>
      <section class="hero">
        <p class="eyebrow">PRIVACY</p>
        <h1>页面数据<br />只在需要时离开浏览器。</h1>
        <p class="lede">
          ericBot 浏览器扩展只在用户开启 Agent 任务并完成本机配对后工作。扩展不会导出
          Cookie、密码或浏览器数据库；任务中的页面文本和交互元素可能随模型请求发送给
          ericBot 模型网关，用于完成当前任务。
        </p>
        <p class="lede">
          配对令牌保存在浏览器扩展本地存储中，可随时在扩展或客户端中断开并撤销。扩展不出售
          浏览数据，也不加载远程代码。问题请通过 GitHub Issues 联系我们。
        </p>
        <p><a href="/">返回首页</a></p>
      </section>
    </main>
  </body>
</html>
