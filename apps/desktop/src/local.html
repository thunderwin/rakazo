<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' data:;"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ericBot</title>
    <link rel="stylesheet" href="tokens.css" />
    <link rel="stylesheet" href="local.css" />
  </head>
  <body>
    <div class="layout">
      <aside class="sidebar">
        <div class="brand">
          <strong>ericBot</strong>
          <span>Local-first client</span>
        </div>
        <div class="new-bot">
          <input id="new-bot-name" type="text" maxlength="120" placeholder="New bot name" />
          <button id="create-bot" type="button">Add</button>
        </div>
        <nav id="bots" class="bot-list" aria-label="Bots"></nav>
        <p class="footnote">Data stays in this app's local SQLite database.</p>
      </aside>

      <main class="main">
        <header class="header">
          <div>
            <h1 id="bot-title">Local chat</h1>
            <p id="bot-detail">Create a bot to begin.</p>
          </div>
          <div class="header-actions">
            <span id="status" role="status"></span>
            <button id="settings-open" type="button" hidden>Settings</button>
            <button id="logout" type="button" hidden>Sign out</button>
          </div>
        </header>

        <section id="messages" class="messages" aria-live="polite"></section>

        <form id="composer" class="composer">
          <textarea
            id="message-text"
            rows="3"
            maxlength="100000"
            placeholder="Message your local bot…"
          ></textarea>
          <button id="send" type="submit">Send</button>
          <button id="stop" type="button" class="stop" hidden>Stop</button>
        </form>

        <section id="login" class="login" hidden>
          <form id="login-form" class="login-card">
            <h2 id="login-title">Sign in</h2>
            <p id="login-server"></p>
            <label id="login-name-field" hidden>
              Name
              <input id="login-name" type="text" autocomplete="name" maxlength="200" />
            </label>
            <label>
              Email
              <input id="login-email" type="email" autocomplete="username" required />
            </label>
            <label>
              Password
              <input
                id="login-password"
                type="password"
                autocomplete="current-password"
                minlength="8"
                required
              />
            </label>
            <button id="login-submit" type="submit">Sign in</button>
            <button id="login-toggle" type="button">Create account</button>
            <p id="login-error" class="login-error" role="alert"></p>
          </form>
        </section>

        <section id="settings-view" class="settings-view" hidden>
          <form id="settings-form" class="settings-card">
            <h2>Settings</h2>
            <div class="settings-grid">
              <label>
                Default model
                <input id="settings-default-model" type="text" maxlength="300" />
              </label>
              <label>
                Theme
                <select id="settings-theme">
                  <option value="system">System</option>
                  <option value="dark">Dark</option>
                  <option value="light">Light</option>
                </select>
              </label>
            </div>
            <label class="settings-check">
              <input id="settings-enter" type="checkbox" />
              Enter sends the message
            </label>

            <h2>Current bot</h2>
            <label>
              Name
              <input id="bot-settings-name" type="text" maxlength="120" />
            </label>
            <label>
              Description
              <input id="bot-settings-description" type="text" maxlength="2000" />
            </label>
            <div class="settings-grid">
              <label>
                Model id
                <input id="bot-settings-model" type="text" maxlength="300" />
              </label>
              <label>
                Thinking
                <select id="bot-settings-thinking">
                  <option value="">Default</option>
                  <option value="off">Off</option>
                  <option value="minimal">Minimal</option>
                  <option value="low">Low</option>
                  <option value="medium">Medium</option>
                  <option value="high">High</option>
                  <option value="xhigh">Extra high</option>
                  <option value="max">Max</option>
                </select>
              </label>
            </div>
            <label>
              Instructions
              <textarea id="bot-settings-instructions" rows="7" maxlength="40000"></textarea>
            </label>
            <p id="settings-error" class="login-error" role="alert"></p>
            <div class="settings-actions">
              <button id="settings-cancel" type="button">Cancel</button>
              <button id="settings-save" type="submit">Save</button>
            </div>
          </form>
        </section>
      </main>
    </div>
    <script src="local.js"></script>
  </body>
</html>
